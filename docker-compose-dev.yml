services:
  web:
    restart: always
    build: .
    container_name: backend_online_cinema
    command: ["/bin/bash", "/commands/run_web_server_dev.sh"]
#    env_file:
#      - .env  # TODO: create .env and .env.example
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/usr/src/fastapi
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"

#   TODO: uncomment when db and minio services are written
#    depends_on:
#      db:
#        condition: service_healthy
#      minio:
#        condition: service_healthy

    volumes:
      - ./src:/usr/src/fastapi
    networks:
      - online_cinema_network

#volumes:
#  pgadmin_online_cinema_data:
#    driver: local
#  minio_data:
#    driver: local
#  redis_data:
#    driver: local

networks:
  online_cinema_network:
    driver: bridge